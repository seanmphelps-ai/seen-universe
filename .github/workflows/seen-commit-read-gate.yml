name: seen-commit-read-gate

on:
  pull_request:
    paths:
      - '**'

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Require commit read proof
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          grep -Fq "FULL_COMMIT_READ_CONFIRMED" <<< "$BODY"
          grep -Fq "COMMITS_READ_ONE_BY_ONE" <<< "$BODY"
          grep -Fq "COMMITS_READ_CHRONOLOGICAL" <<< "$BODY"
