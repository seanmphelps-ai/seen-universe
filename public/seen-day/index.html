<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#070605"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="SEEN Day"/>
<link rel="manifest" href="/seen-day/manifest.webmanifest"/>
<link rel="icon" href="/seen-day/icon.svg" type="image/svg+xml"/>
<title>SEEN Day</title>
<style>:root{--bg:#070605;--gold:#E6C98A;--cream:#F4EAD8;--muted:#A89878;--line:#2A241C}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--cream)}body{font-family:Georgia,Palatino,serif;min-height:100dvh;display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top)) 20px max(24px,env(safe-area-inset-bottom))}main{width:min(100%,420px);text-align:center}.mark{width:72px;height:72px;margin:0 auto 28px;border:1px solid var(--gold);border-radius:50%;display:grid;place-items:center}h1{font-weight:500;font-size:1.75rem;letter-spacing:.18em;margin:0 0 8px}p{color:var(--muted);line-height:1.5;margin:0 0 28px}button{appearance:none;width:100%;min-height:56px;border:1px solid var(--gold);background:var(--gold);color:#070605;font:inherit;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}button:focus-visible{outline:2px solid var(--cream);outline-offset:3px}button[aria-pressed=true]{background:transparent;color:var(--gold)}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:28px}.days span{aspect-ratio:1;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;font-size:.75rem;color:var(--muted)}.days span.on{background:var(--gold);color:#070605;border-color:var(--gold)}#status{min-height:1.5em;margin-top:16px;color:var(--gold)}@media (prefers-reduced-motion:reduce){*{transition:none!important}}</style>
</head>
<body>
<main>
<div class="mark" aria-hidden="true"><svg width="28" height="28" viewBox="0 0 28 28" fill="none"><path d="M14 4v20M8 14h12" stroke="#E6C98A" stroke-width="1.5"/></svg></div>
<h1>SEEN</h1>
<p id="lead">One mark for today. Nothing else.</p>
<button id="mark" type="button" aria-pressed="false">Mark today</button>
<div class="days" id="days" aria-label="Last seven days"></div>
<p id="status" role="status"></p>
</main>
<script>
const KEY='seen-day-marks';
const button=document.getElementById('mark');
const days=document.getElementById('days');
const status=document.getElementById('status');
const lead=document.getElementById('lead');
const today=new Date().toISOString().slice(0,10);
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return []}}
function save(list){localStorage.setItem(KEY,JSON.stringify(list))}
function paint(){const list=load();const marked=list.includes(today);button.setAttribute('aria-pressed',String(marked));button.textContent=marked?'Marked':'Mark today';lead.textContent=marked?'Today is marked.':'One mark for today. Nothing else.';status.textContent=list.length+(list.length===1?' day marked':' days marked');days.replaceChildren();for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const key=d.toISOString().slice(0,10);const cell=document.createElement('span');cell.textContent=String(d.getDate());if(list.includes(key))cell.className='on';cell.setAttribute('aria-label',key+(list.includes(key)?' marked':' open'));days.appendChild(cell)}}
button.addEventListener('click',()=>{const list=load();if(!list.includes(today))list.push(today);save(list);paint()});
paint();
</script>
</body></html>
